<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pit Wall — League Room</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand-link" href="/">
      <div class="brand">
        <span class="flag" aria-hidden="true">&#127937;</span>
        <h1>Pit Wall</h1>
      </div>
    </a>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <span class="chip" id="room-code-chip">ROOM &mdash;</span>
      <span class="chip" id="role-chip" style="display:none;"></span>
      <span class="chip" id="conn-chip">connecting&hellip;</span>
    </div>
  </header>

  <div id="content"></div>

  <footer class="credit">Fantasy Draft F1 Simulator &middot; share this room's link with your league</footer>
</div>
<div id="toast-root"></div>

<script>
"use strict";

var CODE = (location.pathname.split('/').pop() || '').toUpperCase();
var PID_KEY = 'pitwall_pid_' + CODE;
var COMMISH_KEY = 'pitwall_commish_' + CODE;

var participantId = localStorage.getItem(PID_KEY);
if (!participantId){
  participantId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('p_' + Math.random().toString(36).slice(2) + Date.now());
  localStorage.setItem(PID_KEY, participantId);
}
var commissionerToken = localStorage.getItem(COMMISH_KEY) || null;

var ws = null;
var room = null;
var lastPhase = null;
var raceMounted = false;
var nameDebounce = null;

document.getElementById('room-code-chip').textContent = 'ROOM ' + CODE;

function connect(){
  var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/api/room/' + encodeURIComponent(CODE) + '/ws');
  ws.addEventListener('open', function(){
    document.getElementById('conn-chip').textContent = 'live';
    send({ type: 'join', commissionerToken: commissionerToken || undefined });
  });
  ws.addEventListener('message', function(evt){
    var msg;
    try { msg = JSON.parse(evt.data); } catch (e) { return; }
    if (msg.type === 'state'){
      if (!msg.room){ showFatal('This room does not exist.'); return; }
      room = msg.room;
      render();
    } else if (msg.type === 'error'){
      showToast(msg.message);
    }
  });
  ws.addEventListener('close', function(){
    document.getElementById('conn-chip').textContent = 'reconnecting…';
    setTimeout(connect, 1500);
  });
  ws.addEventListener('error', function(){ ws.close(); });
}
function send(payload){
  payload.participantId = participantId;
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(payload));
}

function showToast(message){
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = message;
  document.getElementById('toast-root').appendChild(el);
  setTimeout(function(){ el.remove(); }, 3200);
}
function showFatal(message){
  document.getElementById('content').innerHTML =
    '<div class="panel card"><div class="card-body"><h2>' + escapeHtml(message) + '</h2>' +
    '<p class="hint"><a href="/">Back to Pit Wall</a></p></div></div>';
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}

// ---------------------------------------------------------------------
// Render dispatch
// ---------------------------------------------------------------------

function mySlot(){
  return room.slots.filter(function(s){ return s.claimedBy === participantId; })[0] || null;
}
function isCommissioner(){ return room.commissionerId === participantId; }

function render(){
  if (!room) return;

  var active = document.activeElement;
  var typingName = active && active.id === 'my-name-input';
  if (typingName && lastPhase === room.phase){
    updateChips();
    return;
  }
  lastPhase = room.phase;
  updateChips();

  if (room.phase !== 'picks_race' && qualiTowerTimer){
    clearTimeout(qualiTowerTimer);
    qualiTowerTimer = null;
  }

  var content = document.getElementById('content');
  if (room.phase === 'picks_quali'){
    raceMounted = false;
    content.innerHTML = renderPicksQuali();
    wirePicksQuali();
  } else if (room.phase === 'picks_race'){
    raceMounted = false;
    content.innerHTML = renderPicksRace();
    wirePicksRace();
  } else if (room.phase === 'race_done'){
    if (!raceMounted){
      content.innerHTML = renderRaceShell();
      mountRace(room.final_result);
      raceMounted = true;
    }
  }
}

function updateChips(){
  var roleChip = document.getElementById('role-chip');
  roleChip.style.display = '';
  roleChip.textContent = isCommissioner() ? 'You are the commissioner' : 'You are a driver';
}

// ---------------------------------------------------------------------
// Phase 1: qualifying picks
// ---------------------------------------------------------------------

function tireBtn(compound, selected, extraAttrs){
  var bg = 'var(--tire-' + compound.toLowerCase() + ')';
  var fg = compound === 'Hard' ? '#20242c' : (compound === 'Medium' ? '#2b2205' : (compound === 'Wet' ? '#04182b' : '#2a0508'));
  return '<button type="button" class="tire-btn' + (selected ? ' selected' : '') + '" style="background:' + bg + ';color:' + fg + ';" ' + (extraAttrs || '') + '>' + compound + '</button>';
}
var AGGRESSION_LABELS = ["Conservative", "Cautious", "Balanced", "Assertive", "Aggressive"];
function aggressionLabel(n){ return AGGRESSION_LABELS[n - 1] || 'Balanced'; }
var AGGRESSION_HINT = "Higher aggression means a faster lap, but it wears your tires out quicker and raises the odds of a mistake or a crash -- especially with rivals close by.";
var COMPOUNDS = ['Soft', 'Medium', 'Hard', 'Wet'];
var COMPOUND_HINTS = {
  Soft: 'Fastest tire, wears out quickest. Best for a short stint or qualifying.',
  Medium: 'Balanced pace and durability -- a safe all-round pick.',
  Hard: 'Slowest tire, but lasts the longest. Good for a long stint.',
  Wet: 'Built for a wet track. Much slower than the others if it stays dry.'
};
var PIT_STRATEGY_HINT = 'Fewer stops means more time spent on aging, slower tires between them. More stops means fresher tires more often, but each stop itself costs time in the pit lane.';

function rosterHtml(getMeta){
  var html = '<ol class="roster">';
  room.slots.forEach(function(s){
    var isYou = s.claimedBy === participantId;
    var nameHtml = s.claimedBy ? escapeHtml(s.name) : '<span class="name open">open slot</span>';
    html += '<li class="' + (isYou ? 'is-you' : '') + '">' +
      '<span class="swatch" style="background:' + s.color_hex + '"></span>' +
      '<span class="name">' + nameHtml + (isYou ? ' <span style="color:var(--accent-2);font-family:var(--font-mono);font-size:.7rem;">(you)</span>' : '') + '</span>' +
      '<span class="meta">' + (getMeta ? getMeta(s) : '') + '</span>' +
      '</li>';
  });
  html += '</ol>';
  return html;
}

function circuitRevealHtml(circuit){
  if (!circuit) return '';
  return '<div class="panel" style="margin-bottom:16px;"><div class="card-body">' +
    '<p class="eyebrow">Track</p><h2 style="margin-top:0;">' + escapeHtml(circuit.name) + '</h2>' +
    '<p class="hint">' + escapeHtml(circuit.description) + '</p>' +
    '<div class="choice-group">' +
      '<span class="chip">Tire wear ' + circuit.deg_multiplier.toFixed(2) + 'x</span>' +
      '<span class="chip">Overtaking ' + circuit.overtake_difficulty.toFixed(2) + 'x</span>' +
      '<span class="chip">Crash risk ' + circuit.crash_rate_multiplier.toFixed(2) + 'x</span>' +
      '<span class="chip">Pit lane +' + circuit.pit_loss_bonus.toFixed(1) + 's</span>' +
    '</div></div></div>';
}

function renderPicksQuali(){
  var w = room.quali_weather;
  var slot = mySlot();
  var claimedCount = room.slots.filter(function(s){ return s.claimedBy; }).length;

  var html = circuitRevealHtml(room.circuit);
  html += '<div class="weather-reveal"><div class="track-state ' + w.track_state + '">' + w.track_state.toUpperCase() + '</div>' +
    '<div class="track-temp">' + w.temperature + ' temperature &middot; revealed to everyone before picks</div></div>';

  html += '<div class="race-grid">';
  html += '<div class="panel"><div class="card-body">';
  if (!slot){
    html += '<p class="eyebrow">Step 1</p><h2>Join the grid</h2>' +
      '<p class="hint">Pick a name to claim an open car. Slots go first-come, first-served.</p>' +
      '<div class="field-row"><label for="claim-name">Your name</label><input type="text" id="claim-name" maxlength="24" placeholder="e.g. Alex"></div>' +
      '<div class="actions"><span class="field-help">' + claimedCount + ' / ' + room.slots.length + ' claimed</span>' +
      '<button class="btn btn-primary" id="claim-btn"' + (claimedCount >= room.slots.length ? ' disabled' : '') + '>Join the grid &rarr;</button></div>';
  } else {
    html += '<p class="eyebrow">Your car</p>' +
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;"><span class="swatch" style="width:16px;height:16px;background:' + slot.color_hex + '"></span><h2 style="margin:0;">' + slot.color + ' car</h2></div>' +
      '<div class="field-row"><label for="my-name-input">Name</label><input type="text" id="my-name-input" maxlength="24" value="' + escapeHtml(slot.name) + '"></div>' +
      '<div class="field-row"><label>Aggression</label><div class="agg-row"><input type="range" id="my-agg" min="1" max="5" value="' + slot.aggression + '">' +
      '<span class="agg-label" id="my-agg-label">' + aggressionLabel(slot.aggression) + '</span></div>' +
      '<p class="strategy-hint">' + AGGRESSION_HINT + '</p></div>' +
      '<div class="field-row"><label>Qualifying tire (this compound locks out of the race)</label><div class="choice-group">' +
      COMPOUNDS.map(function(c){ return tireBtn(c, slot.quali_compound === c, 'data-quali="' + c + '"'); }).join('') + '</div>' +
      '<p class="strategy-hint" id="my-quali-tire-hint">' + COMPOUND_HINTS[slot.quali_compound] + '</p></div>';
  }
  html += '</div></div>';

  html += '<div style="display:flex;flex-direction:column;gap:16px;">';
  html += '<div class="panel"><div class="panel-head"><span>Grid</span><span class="count">' + claimedCount + ' / ' + room.slots.length + '</span></div>' +
    rosterHtml(function(s){ return s.claimedBy ? (aggressionLabel(s.aggression) + ' &middot; ' + s.quali_compound) : ''; }) + '</div>';
  html += '<div class="panel"><div class="card-body">';
  if (isCommissioner()){
    html += '<p class="eyebrow">Commissioner</p><h2 style="font-size:1.15rem;">Ready to qualify?</h2>' +
      '<p class="hint">Anyone who hasn\'t claimed a car will race with default settings. This can\'t be undone.</p>' +
      '<button class="btn btn-primary btn-block" id="start-quali-btn">Start qualifying &rarr;</button>';
  } else {
    html += '<p class="eyebrow">Commissioner</p><h2 style="font-size:1.15rem;">Waiting to start</h2>' +
      '<p class="hint">Only the commissioner can start qualifying. Sit tight once your picks are in.</p>';
  }
  html += '</div></div></div>';
  html += '</div>';
  return html;
}

function wirePicksQuali(){
  var claimBtn = document.getElementById('claim-btn');
  if (claimBtn){
    claimBtn.addEventListener('click', function(){
      var name = document.getElementById('claim-name').value.trim();
      send({ type: 'claim_slot', name: name });
    });
  }
  var nameEl = document.getElementById('my-name-input');
  if (nameEl){
    nameEl.addEventListener('input', function(){
      clearTimeout(nameDebounce);
      var val = nameEl.value;
      nameDebounce = setTimeout(function(){ send({ type: 'update_quali_pick', name: val }); }, 400);
    });
  }
  var aggEl = document.getElementById('my-agg');
  if (aggEl){
    aggEl.addEventListener('input', function(){
      document.getElementById('my-agg-label').textContent = aggressionLabel(parseInt(aggEl.value, 10));
    });
    aggEl.addEventListener('change', function(){
      send({ type: 'update_quali_pick', aggression: parseInt(aggEl.value, 10) });
    });
  }
  document.querySelectorAll('[data-quali]').forEach(function(btn){
    btn.addEventListener('click', function(){
      send({ type: 'update_quali_pick', quali_compound: this.dataset.quali });
    });
  });
  var startBtn = document.getElementById('start-quali-btn');
  if (startBtn) startBtn.addEventListener('click', function(){ send({ type: 'start_qualifying' }); });
}

// ---------------------------------------------------------------------
// Phase 2: race picks (after qualifying results + fresh race weather)
// ---------------------------------------------------------------------

function raceTireRowsHtml(slot){
  var available = COMPOUNDS.filter(function(c){ return c !== slot.quali_compound; });
  var html = '';
  for (var s = 0; s < slot.race_compounds.length; s++){
    // Each stint must run a different compound, so a tire already used by
    // another stint isn't offered here (this stint's own current pick still
    // shows, selected, so clicking it again is a no-op rather than a dead end).
    var options = available.filter(function(c){ return c === slot.race_compounds[s] || slot.race_compounds.indexOf(c) === -1; });
    html += '<div class="choice-group" style="margin-bottom:6px;">' +
      options.map(function(c){ return tireBtn(c, slot.race_compounds[s] === c, 'data-stint="' + s + '" data-tire="' + c + '"'); }).join('') +
      '</div>';
  }
  return html;
}

function renderPicksRace(){
  var slotById = {};
  room.slots.forEach(function(s){ slotById[s.slot] = s; });
  var slot = mySlot();
  var rw = room.race_weather;
  var done = qualiTowerDone();

  var html = '<div class="panel" style="margin-bottom:16px;">' +
    '<div class="panel-head"><span>Qualifying results</span><span class="count" id="room-quali-status"></span></div>' +
    '<ol class="leaderboard quali-live" id="room-quali-list"></ol></div>';

  if (!done){
    html += '<div class="panel"><div class="card-body">' +
      '<p class="eyebrow">Watching</p><h2 style="font-size:1.15rem;">Qualifying is on track&hellip;</h2>' +
      '<p class="hint">Race strategy picks unlock once every car has set a time.</p>' +
      '</div></div>';
    return html;
  }

  html += circuitRevealHtml(room.circuit);
  html += '<div class="weather-reveal"><div class="track-state ' + rw.track_state + '">' + rw.track_state.toUpperCase() + '</div>' +
    '<div class="track-temp">' + rw.temperature + ' temperature &middot; fresh conditions for the race</div></div>';

  html += '<div class="race-grid">';
  html += '<div class="panel"><div class="card-body">';
  if (slot){
    html += '<p class="eyebrow">Your race strategy</p>' +
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;"><span class="swatch" style="width:16px;height:16px;background:' + slot.color_hex + '"></span><h2 style="margin:0;">' + slot.color + ' car</h2></div>' +
      '<div class="field-row"><label>Aggression</label><div class="agg-row"><input type="range" id="my-race-agg" min="1" max="5" value="' + slot.race_aggression + '">' +
      '<span class="agg-label" id="my-race-agg-label">' + aggressionLabel(slot.race_aggression) + '</span></div>' +
      '<p class="strategy-hint">' + AGGRESSION_HINT + '</p></div>' +
      '<p class="hint">' + slot.quali_compound + ' is locked out &mdash; pick from the remaining three compounds.</p>' +
      '<div class="field-row"><label>Pit strategy</label><div class="choice-group">' +
      '<button type="button" class="choice-btn' + (slot.num_stops === 1 ? ' selected' : '') + '" data-stops="1">1-stop</button>' +
      '<button type="button" class="choice-btn' + (slot.num_stops === 2 ? ' selected' : '') + '" data-stops="2">2-stop</button>' +
      '</div>' +
      '<p class="strategy-hint">' + PIT_STRATEGY_HINT + '</p></div>' +
      '<div class="field-row"><label>Race tires (one per stint, no repeats)</label>' + raceTireRowsHtml(slot) +
      '<p class="strategy-hint">' + slot.race_compounds.filter(function(c, i){ return slot.race_compounds.indexOf(c) === i; })
        .map(function(c){ return '<strong>' + c + ':</strong> ' + COMPOUND_HINTS[c]; }).join('<br>') + '</p></div>';
  } else {
    html += '<p class="eyebrow">No car</p><h2 style="font-size:1.15rem;">You didn\'t claim a car</h2>' +
      '<p class="hint">Qualifying is already locked in, so this room\'s grid is set. You can still watch.</p>';
  }
  html += '</div></div>';

  html += '<div style="display:flex;flex-direction:column;gap:16px;">';
  html += '<div class="panel"><div class="panel-head"><span>Grid</span></div>' +
    rosterHtml(function(s){ return aggressionLabel(s.race_aggression) + ' &middot; ' + s.num_stops + '-stop &middot; ' + s.race_compounds.join(' &rarr; '); }) + '</div>';
  html += '<div class="panel"><div class="card-body">';
  if (isCommissioner()){
    html += '<p class="eyebrow">Commissioner</p><h2 style="font-size:1.15rem;">Ready to race?</h2>' +
      '<p class="hint">Everyone races with whatever strategy is currently set. This can\'t be undone.</p>' +
      '<button class="btn btn-primary btn-block" id="start-race-btn">Start the race &rarr;</button>';
  } else {
    html += '<p class="eyebrow">Commissioner</p><h2 style="font-size:1.15rem;">Waiting to start</h2>' +
      '<p class="hint">Only the commissioner can start the race.</p>';
  }
  html += '</div></div></div>';
  html += '</div>';
  return html;
}

function wirePicksRace(){
  var slot = mySlot();
  if (slot){
    var raceAggEl = document.getElementById('my-race-agg');
    if (raceAggEl){
      raceAggEl.addEventListener('input', function(){
        document.getElementById('my-race-agg-label').textContent = aggressionLabel(parseInt(raceAggEl.value, 10));
      });
      raceAggEl.addEventListener('change', function(){
        send({ type: 'update_race_pick', aggression: parseInt(raceAggEl.value, 10), num_stops: slot.num_stops, race_compounds: slot.race_compounds });
      });
    }
    document.querySelectorAll('[data-stops]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var numStops = parseInt(this.dataset.stops, 10);
        var available = COMPOUNDS.filter(function(c){ return c !== slot.quali_compound; });
        var stints = numStops + 1;
        var rc = slot.race_compounds.slice(0, stints);
        while (rc.length < stints){
          var fill = available.filter(function(c){ return rc.indexOf(c) === -1; })[0] || available[0];
          rc.push(fill);
        }
        send({ type: 'update_race_pick', num_stops: numStops, race_compounds: rc });
      });
    });
    document.querySelectorAll('[data-stint]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var rc = slot.race_compounds.slice();
        rc[parseInt(this.dataset.stint, 10)] = this.dataset.tire;
        send({ type: 'update_race_pick', num_stops: slot.num_stops, race_compounds: rc });
      });
    });
  }
  var startBtn = document.getElementById('start-race-btn');
  if (startBtn) startBtn.addEventListener('click', function(){ send({ type: 'start_race' }); });

  ensureQualiTowerRunning();
}

// ---------------------------------------------------------------------
// Live qualifying timing tower (picks_race phase)
//
// The server already computed the final qualifying result by the time we
// see it, but the room re-renders this whole phase's DOM on every
// websocket message (any other driver nudging a slider included), so the
// reveal-by-timer state has to live outside the DOM in module vars --
// otherwise every unrelated update would restart or freeze the animation.
// Each render just repaints the tower from whatever qualiTowerRevealed
// currently holds; the timer (started once per new quali_result) keeps
// advancing it and repainting directly, independent of full re-renders.
// ---------------------------------------------------------------------

var qualiTowerKey = null;
var qualiTowerOrder = [];
var qualiTowerRevealed = [];
var qualiTowerTimer = null;

function qualiTowerDone(){
  return qualiTowerOrder.length > 0 && qualiTowerRevealed.length >= qualiTowerOrder.length;
}

function paintQualiTower(){
  var listEl = document.getElementById('room-quali-list');
  var statusEl = document.getElementById('room-quali-status');
  if (!listEl || !statusEl) return;
  var slotById = {};
  room.slots.forEach(function(s){ slotById[s.slot] = s; });
  var total = room.quali_result.results.length;

  var sorted = qualiTowerRevealed.slice().sort(function(a,b){ return a.time - b.time; });
  var leaderTime = sorted.length ? sorted[0].time : null;
  var html = '';
  sorted.forEach(function(r, idx){
    var s = slotById[r.driver_id];
    var gapHtml = idx === 0
      ? '<span class="lb-gap leader">P1</span>'
      : '<span class="lb-gap">+' + (r.time - leaderTime).toFixed(3) + 's</span>';
    var rowClass = 'lb-row' + (r._justSet ? ' just-set' : '');
    html += '<li class="' + rowClass + '">' +
      '<span class="lb-pos">' + (idx + 1) + '</span>' +
      '<span class="swatch" style="background:' + s.color_hex + '"></span>' +
      '<span class="lb-name">' + escapeHtml(s.name) + '</span>' +
      '<span class="tire-chip tire-' + r.compound + '">' + r.compound + '</span>' +
      (r.mistake ? '<span class="mistake-flag">MISTAKE</span>' : '<span></span>') +
      gapHtml +
      '</li>';
  });
  qualiTowerOrder.forEach(function(r){
    if (qualiTowerRevealed.indexOf(r) !== -1) return;
    var s = slotById[r.driver_id];
    html += '<li class="lb-row pending">' +
      '<span class="lb-pos">&mdash;</span>' +
      '<span class="swatch" style="background:' + s.color_hex + '"></span>' +
      '<span class="lb-name">' + escapeHtml(s.name) + '</span>' +
      '<span></span><span></span>' +
      '<span class="on-track">On track</span>' +
      '</li>';
  });
  listEl.innerHTML = html;
  statusEl.innerHTML = qualiTowerRevealed.length < total
    ? '<span class="live-dot"></span>LIVE &middot; ' + qualiTowerRevealed.length + ' / ' + total + ' set'
    : 'SESSION COMPLETE &middot; ' + total + ' drivers';
}

function ensureQualiTowerRunning(){
  var key = room.quali_result.results.map(function(r){ return r.driver_id + ':' + r.time; }).join('|');
  if (key !== qualiTowerKey){
    if (qualiTowerTimer){ clearTimeout(qualiTowerTimer); qualiTowerTimer = null; }
    qualiTowerKey = key;
    qualiTowerOrder = room.quali_result.results.slice();
    for (var i = qualiTowerOrder.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = qualiTowerOrder[i]; qualiTowerOrder[i] = qualiTowerOrder[j]; qualiTowerOrder[j] = tmp;
    }
    qualiTowerRevealed = [];
  }
  paintQualiTower();
  if (!qualiTowerTimer && qualiTowerRevealed.length < qualiTowerOrder.length){
    qualiTowerTimer = setTimeout(revealNextQualiRow, 320 + Math.random() * 260);
  }
}

function revealNextQualiRow(){
  qualiTowerRevealed.forEach(function(r){ r._justSet = false; });
  var r = qualiTowerOrder[qualiTowerRevealed.length];
  r._justSet = true;
  qualiTowerRevealed.push(r);
  paintQualiTower();
  if (qualiTowerRevealed.length < qualiTowerOrder.length){
    qualiTowerTimer = setTimeout(revealNextQualiRow, 320 + Math.random() * 260);
  } else {
    qualiTowerTimer = null;
    // The reveal just finished on its own timer, independent of any
    // websocket state change -- re-render this phase now so the race
    // strategy picks (gated behind qualiTowerDone()) actually unlock.
    if (room && room.phase === 'picks_race'){
      var content = document.getElementById('content');
      content.innerHTML = renderPicksRace();
      wirePicksRace();
    }
  }
}

// ---------------------------------------------------------------------
// Replay engine (ported from viz/index.html — same JSON schema, same
// car-sprite renderer, driven here by the room's server-computed result)
// ---------------------------------------------------------------------

var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var raceData = null;
var checkpoints = null;
var driversById = null;
var clockMax = 1;
var clock = 0;
var playing = false;
var speed = 2;
var lastFrameTs = null;
var domThrottle = 0;
var trailHistory = {};
var laneOffset = {};
var canvas = null;
var ctx = null;
// Set once canvas exists (mountRace); see viz/index.html for the fuller
// explanation of what this scales.
var PXSCALE = 1;

function fmtTime(t){ return t == null ? "--" : t.toFixed(1) + "s"; }
function fmtGap(g){ return g == null ? "--" : "+" + g.toFixed(2) + "s"; }

// Track geometry -- a real closed circuit shape, built from the room's
// rolled circuit.shape: an explicit list of (x, y, corner roundedness)
// waypoints -- not one point per angle from a shared center, so the
// track can genuinely fold back on itself (real hairpins, esses) --
// connected with straights and rounded corners -- same config as
// engine.py/engine.js. See viz/index.html for the fuller explanation,
// this is a straight port.
function trackShape(points){
  return { vertices: points.map(function(p){ return { x: p[0], y: p[1], corner: p[2] }; }) };
}
var DEFAULT_TRACK_SHAPE = trackShape([
  [400, -180, 0.47], [380, -280, 0.87], [280, -260, 0.5], [236.2, -140.1, 0.6],
  [176.8, -114.7, 0.5], [144.4, -67.2, 0.5], [93.1, 4.1, 0.82], [-56.5, -62.3, 0.35],
  [-138.4, -55.4, 1], [-158.6, 80.5, 1], [-205.5, 158.3, 1], [-303.8, 95.9, 0.69],
  [-414.5, 225.5, 0.53], [-526.3, 183.9, 0.71], [-600, 350, 0.8], [-150, 325, 0.4],
  [-117.5, 13.3, 0.93], [14.8, 105.6, 0.58], [58, 108.3, 0.3], [105.5, 117.5, 0.98]
]);
var TRACK = null; // built by buildTrackGeometry() once per race mount

function shapeVertexPoint(shape, v){
  return { x: v.x, y: v.y, corner: v.corner };
}

// Signed area of the vertex polygon (shoelace formula). Its sign gives a
// single, constant "which way is outward" for the whole loop -- correct
// for any simple polygon including concave ones (hairpins), unlike a
// per-point "away from the origin" test.
function polygonSignedArea(vertices){
  var a = 0, n = vertices.length;
  for (var i=0;i<n;i++){
    var p = vertices[i], q = vertices[(i+1)%n];
    a += p.x*q.y - q.x*p.y;
  }
  return a / 2;
}

function buildRoundedPolygonRaw(shape){
  var verts = shape.vertices.map(function(v){ return shapeVertexPoint(shape, v); });
  var n = verts.length;
  var straightSamples = 14, arcSamples = 16;

  function sub(a,b){ return {x:a.x-b.x, y:a.y-b.y}; }
  function vlen(a){ return Math.sqrt(a.x*a.x+a.y*a.y); }
  function norm(a){ var l=vlen(a)||1; return {x:a.x/l, y:a.y/l}; }
  function vdist(a,b){ return vlen(sub(a,b)); }

  var corners = [];
  for (var i=0;i<n;i++){
    var prev = verts[(i-1+n)%n], cur = verts[i], next = verts[(i+1)%n];
    var inDir = norm(sub(cur, prev)), outDir = norm(sub(next, cur));
    var maxT = 0.5 * Math.min(vdist(cur, prev), vdist(next, cur)) * 0.92;
    var t = Math.max(0.001, cur.corner * maxT);
    var cross = inDir.x*outDir.y - inDir.y*outDir.x;
    var dot = Math.max(-1, Math.min(1, inDir.x*outDir.x + inDir.y*outDir.y));
    var turn = Math.atan2(cross, dot);
    var Tin = { x: cur.x - inDir.x*t, y: cur.y - inDir.y*t };
    var Tout = { x: cur.x + outDir.x*t, y: cur.y + outDir.y*t };
    var absTurn = Math.abs(turn);
    var c = { Tin: Tin, Tout: Tout, r: 0 };
    if (absTurn >= 1e-4){
      var r = t / Math.tan(absTurn/2);
      var sign = turn > 0 ? 1 : -1;
      var nIn = sign > 0 ? {x:-inDir.y, y:inDir.x} : {x:inDir.y, y:-inDir.x};
      var center = { x: Tin.x + nIn.x*r, y: Tin.y + nIn.y*r };
      c.r = r; c.center = center; c.sweepCCW = sign > 0;
      c.aStart = Math.atan2(Tin.y-center.y, Tin.x-center.x);
      c.aEnd = Math.atan2(Tout.y-center.y, Tout.x-center.x);
    } else {
      c.cur = cur;
    }
    corners.push(c);
  }

  var raw = [];
  for (var i=0;i<n;i++){
    var c = corners[i], prevC = corners[(i-1+n)%n];
    var a = prevC.Tout, b = c.Tin;
    for (var s=0; s<straightSamples; s++){
      var f = s/straightSamples;
      raw.push({ x: a.x+(b.x-a.x)*f, y: a.y+(b.y-a.y)*f });
    }
    if (c.r > 0){
      var a0 = c.aStart, a1 = c.aEnd;
      if (c.sweepCCW){ while (a1 < a0) a1 += Math.PI*2; }
      else { while (a1 > a0) a1 -= Math.PI*2; }
      for (var k=0;k<=arcSamples;k++){
        var ang = a0 + (a1-a0)*k/arcSamples;
        raw.push({ x: c.center.x + c.r*Math.cos(ang), y: c.center.y + c.r*Math.sin(ang) });
      }
    } else {
      raw.push(c.cur);
    }
  }
  raw.push(raw[0]);
  return raw;
}

function buildTrackGeometry(shape){
  var raw = buildRoundedPolygonRaw(shape);
  var N = raw.length - 1;
  var outwardSign = polygonSignedArea(shape.vertices) < 0 ? 1 : -1;

  var minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  raw.forEach(function(p){
    if (p.x<minX) minX=p.x; if (p.x>maxX) maxX=p.x;
    if (p.y<minY) minY=p.y; if (p.y>maxY) maxY=p.y;
  });

  var band = 40 * PXSCALE;
  var margin = 56 * PXSCALE;
  var availW = canvas.width - margin*2, availH = canvas.height - margin*2;
  var scale = Math.min(availW / (maxX-minX), availH / (maxY-minY));
  var cx = canvas.width/2 - ((minX+maxX)/2) * scale;
  var cy = canvas.height/2 - ((minY+maxY)/2) * scale;

  var cum = [0];
  for (var j = 1; j <= N; j++){
    var dx = raw[j].x - raw[j-1].x, dy = raw[j].y - raw[j-1].y;
    cum.push(cum[j-1] + Math.sqrt(dx*dx + dy*dy));
  }

  TRACK = { raw: raw, cum: cum, totalLen: cum[N], scale: scale, cx: cx, cy: cy, band: band, N: N, outwardSign: outwardSign };
}

function rawAtFraction(f){
  f = ((f % 1) + 1) % 1;
  var target = f * TRACK.totalLen;
  var cum = TRACK.cum, lo = 0, hi = TRACK.N;
  while (lo < hi){
    var mid = (lo + hi) >> 1;
    if (cum[mid] < target) lo = mid + 1; else hi = mid;
  }
  var i1 = Math.max(1, lo), i0 = i1 - 1;
  var span = cum[i1] - cum[i0];
  var t = span > 0 ? (target - cum[i0]) / span : 0;
  var a = TRACK.raw[i0], b = TRACK.raw[i1];
  return { x: a.x + (b.x-a.x)*t, y: a.y + (b.y-a.y)*t };
}

function trackPoint(f, offsetPx){
  var eps = 0.0015;
  var p0 = rawAtFraction(f - eps), p1 = rawAtFraction(f + eps), p = rawAtFraction(f);
  var tx = p1.x - p0.x, ty = p1.y - p0.y;
  var tlen = Math.sqrt(tx*tx + ty*ty) || 1;
  tx /= tlen; ty /= tlen;
  var nx = ty * TRACK.outwardSign, ny = -tx * TRACK.outwardSign;
  var off = offsetPx || 0;
  return {
    x: TRACK.cx + p.x*TRACK.scale + nx*off,
    y: TRACK.cy + p.y*TRACK.scale + ny*off,
    angle: Math.atan2(ty, tx)
  };
}

function pathThroughPoints(pts){
  ctx.beginPath();
  pts.forEach(function(p, i){ if (i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
  ctx.closePath();
}

function drawTrack(){
  var w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);

  var styles = getComputedStyle(document.documentElement);
  var bg = styles.getPropertyValue('--bg').trim() || '#0a0d12';
  var trackSurface = styles.getPropertyValue('--track-surface').trim() || '#1a2029';
  var trackLine = styles.getPropertyValue('--track-line').trim() || '#333d4f';

  ctx.fillStyle = bg;
  ctx.fillRect(0,0,w,h);

  var half = TRACK.band/2, M = 300;
  var outerPts = [], innerPts = [];
  for (var i=0;i<=M;i++){
    var f = i/M;
    outerPts.push(trackPoint(f, half));
    innerPts.push(trackPoint(f, -half));
  }

  pathThroughPoints(innerPts);
  ctx.fillStyle = shadeColor(bg, 14);
  ctx.fill();

  ctx.beginPath();
  outerPts.forEach(function(p,i){ if (i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
  ctx.closePath();
  innerPts.forEach(function(p,i){ if (i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
  ctx.closePath();
  ctx.fillStyle = trackSurface;
  ctx.fill('evenodd');

  ctx.strokeStyle = trackLine;
  ctx.lineWidth = 2 * PXSCALE;
  pathThroughPoints(outerPts); ctx.stroke();
  pathThroughPoints(innerPts); ctx.stroke();

  drawCurbs(half);

  var sf = trackPoint(0);
  ctx.save();
  ctx.translate(sf.x, sf.y);
  ctx.rotate(sf.angle);
  var stripDepth = 6 * PXSCALE, rows = 2, cols = 6;
  var cellW = stripDepth/cols, cellH = TRACK.band/rows;
  for (var row=0; row<rows; row++){
    for (var col=0; col<cols; col++){
      ctx.fillStyle = ((row+col)%2===0) ? '#e8ecf0' : '#1a1f27';
      ctx.fillRect(-stripDepth/2 + col*cellW, -TRACK.band/2 + row*cellH, cellW, cellH);
    }
  }
  ctx.restore();
}

// Alternating red/white kerb blocks, auto-placed by curvature (the
// highest-curvature third or so of the lap) instead of a hardcoded
// corner list -- works for any of this circuit's harmonic shapes.
function drawCurbs(half){
  var M = 300;
  var angles = [];
  for (var i=0;i<M;i++) angles.push(trackPoint(i/M).angle);
  var curv = [];
  for (var i=0;i<M;i++){
    var a0 = angles[(i-1+M)%M], a1 = angles[(i+1)%M];
    curv.push(Math.abs(Math.atan2(Math.sin(a1-a0), Math.cos(a1-a0))));
  }

  var sorted = curv.slice().sort(function(a,b){ return b-a; });
  var threshold = sorted[Math.floor(M*0.35)];

  var minIdx = 0, minVal = Infinity;
  for (var i=0;i<M;i++){ if (curv[i] < minVal){ minVal = curv[i]; minIdx = i; } }

  var runs = [], curRun = null;
  for (var j=0;j<M;j++){
    var idx = (minIdx + j) % M;
    if (curv[idx] >= threshold){
      if (!curRun) curRun = { start: j, end: j }; else curRun.end = j;
    } else if (curRun){ runs.push(curRun); curRun = null; }
  }
  if (curRun) runs.push(curRun);

  runs.forEach(function(run){
    var count = run.end - run.start + 1;
    if (count < 5) return;
    var n = Math.max(6, Math.round(count/2));
    for (var k=0;k<n;k++){
      var ga = run.start + (count*k)/n, gb = run.start + (count*(k+1))/n;
      var fa = ((minIdx+ga) % M) / M, fb = ((minIdx+gb) % M) / M;
      var pa1 = trackPoint(fa, half+0.5*PXSCALE), pa2 = trackPoint(fa, half+7*PXSCALE);
      var pb1 = trackPoint(fb, half+0.5*PXSCALE), pb2 = trackPoint(fb, half+7*PXSCALE);
      ctx.beginPath();
      ctx.moveTo(pa1.x,pa1.y); ctx.lineTo(pa2.x,pa2.y); ctx.lineTo(pb2.x,pb2.y); ctx.lineTo(pb1.x,pb1.y);
      ctx.closePath();
      ctx.fillStyle = (k%2===0) ? '#c0392b' : '#e8ecf0';
      ctx.fill();
    }
  });
}

function stateAt(driverId, t){
  var cps = checkpoints[driverId];
  var prev = cps[0];
  var next = null;
  var dnfCp = null;

  for (var i=1;i<cps.length;i++){
    var cp = cps[i];
    if (cp.dnf){ dnfCp = cp; break; }
    if (cp.t <= t){ prev = cp; }
    else { next = cp; break; }
  }

  if (dnfCp){
    var dnfProgress = prev.lap - 0.4;
    var frac = ((dnfProgress % 1) + 1) % 1;
    var reached = t >= (prev.t || 0);
    return {
      status: reached ? 'dnf' : 'racing',
      trackFrac: frac,
      progress: prev.lap - 0.4,
      lap: dnfCp.lap,
      compound: dnfCp.compound,
      reason: dnfCp.reason,
      position: null,
      gap: null
    };
  }

  if (!next){
    if (cps.length === 1){
      return { status:'pending', trackFrac:0, progress:0, lap:0, compound: driversById[driverId].quali_compound, position:null, gap:null };
    }
    return {
      status:'finished', trackFrac:0, progress: raceData.num_laps + (100000 - prev.t)/1000000,
      lap: raceData.num_laps, compound: prev.compound, position: prev.position, gap: prev.gap
    };
  }

  var span = next.t - (prev.t||0);
  var localT = span>0 ? (t-(prev.t||0))/span : 1;
  if (localT<0) localT=0; if (localT>1) localT=1;
  var lapNum = next.lap;
  var trackFrac = localT;
  return {
    status:'racing', trackFrac: trackFrac, progress: (lapNum-1)+localT,
    lap: lapNum, compound: next.compound, position: prev.position, gap: prev.gap,
    justPitted: next.pit, overtake: next.overtake
  };
}

function orderedField(t){
  var ids = raceData.drivers.map(function(d){return d.driver_id;});
  var states = ids.map(function(id){ return { id:id, s: stateAt(id,t) }; });
  states.sort(function(a,b){
    var rankA = a.s.status==='dnf' ? 1 : 0;
    var rankB = b.s.status==='dnf' ? 1 : 0;
    if (rankA !== rankB) return rankA - rankB;
    return b.s.progress - a.s.progress;
  });
  return states;
}

function renderCars(t){
  var field = orderedField(t);
  for (var fi = field.length - 1; fi >= 0; fi--){
    var entry = field[fi];
    var s = entry.s;
    if (s.status==='pending') continue;
    var driver = driversById[entry.id];
    var p = trackPoint(s.trackFrac);
    var off = laneOffset[entry.id] || 0;
    p = { x: p.x + off * Math.cos(p.angle + Math.PI/2), y: p.y + off * Math.sin(p.angle + Math.PI/2) };

    if (!reducedMotion && s.status !== 'dnf'){
      var hist = trailHistory[entry.id];
      hist.push({x:p.x,y:p.y});
      if (hist.length>6) hist.shift();
      for (var i=0;i<hist.length-1;i++){
        var a = (i+1)/hist.length * 0.28;
        ctx.beginPath();
        ctx.fillStyle = hexWithAlpha(driver.color_hex, a);
        ctx.arc(hist[i].x, hist[i].y, 3.2*PXSCALE, 0, Math.PI*2);
        ctx.fill();
      }
    }

    drawCarSprite(p.x, p.y, p.angle, driver.color_hex, s.status==='dnf');

    if (s.status==='dnf'){
      ctx.strokeStyle = '#ef4b4b';
      ctx.lineWidth = 1.4 * PXSCALE;
      ctx.beginPath();
      ctx.moveTo(p.x-4*PXSCALE,p.y-11*PXSCALE); ctx.lineTo(p.x+4*PXSCALE,p.y-3*PXSCALE);
      ctx.moveTo(p.x-4*PXSCALE,p.y-3*PXSCALE); ctx.lineTo(p.x+4*PXSCALE,p.y-11*PXSCALE);
      ctx.stroke();
    }
  }
}

function hexWithAlpha(hex, alpha){
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}
function shadeColor(hex, percent){
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  var t = percent < 0 ? 0 : 255;
  var p = Math.abs(percent) / 100;
  r = Math.round((t - r) * p) + r;
  g = Math.round((t - g) * p) + g;
  b = Math.round((t - b) * p) + b;
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function roundRectPath(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function carBodyPath(L, W){
  var noseX = L/2, tailX = -L/2;
  var shoulderX = L*0.12;
  var cockpitHW = W*0.5, tailHW = W*0.30;
  ctx.beginPath();
  ctx.moveTo(noseX, 0);
  ctx.quadraticCurveTo(noseX-3.2, -cockpitHW*0.55, shoulderX, -cockpitHW);
  ctx.lineTo(shoulderX-6.5, -cockpitHW);
  ctx.quadraticCurveTo(tailX+4.5, -tailHW*1.15, tailX, -tailHW*0.55);
  ctx.lineTo(tailX, tailHW*0.55);
  ctx.quadraticCurveTo(tailX+4.5, tailHW*1.15, shoulderX-6.5, cockpitHW);
  ctx.lineTo(shoulderX, cockpitHW);
  ctx.quadraticCurveTo(noseX-3.2, cockpitHW*0.55, noseX, 0);
  ctx.closePath();
}

var CAR_SCALE = 1.4; // reset relative to PXSCALE in mountRace() once canvas exists

function drawCarSprite(x, y, angle, colorHex, dnf){
  var L = 21, W = 8;

  if (!dnf){
    var shadow = ctx.createRadialGradient(x, y+1.5*CAR_SCALE, 0, x, y+1.5*CAR_SCALE, 10*CAR_SCALE);
    shadow.addColorStop(0, 'rgba(0,0,0,0.32)');
    shadow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = shadow;
    ctx.beginPath();
    ctx.ellipse(x, y+1.5*CAR_SCALE, 10*CAR_SCALE, 6.5*CAR_SCALE, 0, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.scale(CAR_SCALE, CAR_SCALE);
  ctx.globalAlpha = dnf ? 0.5 : 1;

  var bodyColor = dnf ? '#4a5265' : colorHex;
  var darkColor = dnf ? '#3d4453' : shadeColor(colorHex, -45);

  var frontAxle = L/2 - 4.8, rearAxle = -L/2 + 4.6, trackHalf = W/2 + 1.0;
  ctx.fillStyle = 'rgba(8,9,13,0.95)';
  [[frontAxle,-trackHalf],[frontAxle,trackHalf],[rearAxle,-trackHalf],[rearAxle,trackHalf]].forEach(function(w){
    roundRectPath(w[0]-1.8, w[1]-1.2, 3.6, 2.4, 1.0);
    ctx.fill();
  });

  ctx.fillStyle = darkColor;
  roundRectPath(-L/2-2.0, -(W/2+1.2), 1.6, W+2.4, 0.5); ctx.fill();
  roundRectPath(-L/2-2.2, -(W/2+1.3), 0.9, 1.3, 0.3); ctx.fill();
  roundRectPath(-L/2-2.2, (W/2), 0.9, 1.3, 0.3); ctx.fill();

  roundRectPath(L/2-0.8, -(W/2+1.3), 1.4, W+2.6, 0.5); ctx.fill();
  roundRectPath(L/2-0.9, -(W/2+1.4), 0.9, 1.3, 0.3); ctx.fill();
  roundRectPath(L/2-0.9, (W/2+0.1), 0.9, 1.3, 0.3); ctx.fill();
  roundRectPath(L/2-2.4, -0.5, 1.8, 1.0, 0.3); ctx.fill();

  carBodyPath(L, W);
  if (dnf){
    ctx.fillStyle = bodyColor;
  } else {
    var gloss = ctx.createLinearGradient(0, -W/2, 0, W/2);
    gloss.addColorStop(0, shadeColor(bodyColor, 28));
    gloss.addColorStop(0.5, bodyColor);
    gloss.addColorStop(1, shadeColor(bodyColor, -22));
    ctx.fillStyle = gloss;
  }
  ctx.fill();
  ctx.lineWidth = 0.7;
  ctx.strokeStyle = 'rgba(6,8,12,0.6)';
  ctx.stroke();

  ctx.fillStyle = darkColor;
  roundRectPath(-1.5, -W/2+0.4, 5.5, 1.2, 0.5); ctx.fill();
  roundRectPath(-1.5, W/2-1.6, 5.5, 1.2, 0.5); ctx.fill();

  ctx.strokeStyle = dnf ? 'rgba(120,124,132,0.7)' : 'rgba(205,209,217,0.9)';
  ctx.lineWidth = 1.0;
  ctx.beginPath();
  ctx.ellipse(1.0, 0, 2.9, 2.1, 0, Math.PI*0.18, Math.PI*1.82);
  ctx.stroke();
  ctx.fillStyle = 'rgba(6,8,11,0.9)';
  ctx.beginPath();
  ctx.ellipse(0.8, 0, 2.0, 1.5, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.globalAlpha = 1;
  ctx.restore();
}

function setRaceWeatherChip(w){
  var el = document.getElementById('race-weather-chip');
  if (el) el.textContent = w.track_state + ' / ' + w.temperature;
}
function setCircuitLabel(circuit){
  var el = document.getElementById('circuit-name-chip');
  if (!el) return;
  el.textContent = circuit ? circuit.name : 'Track';
  if (circuit) el.title = circuit.description || '';
}
function weatherAt(t){
  if (!raceData.weather_timeline || !raceData.weather_timeline.length) return raceData.weather;
  var field = orderedField(t);
  var leadLap = 0;
  field.forEach(function(e){ if (e.s.lap > leadLap) leadLap = e.s.lap; });
  if (leadLap <= 0) return raceData.weather;
  var entry = raceData.weather_timeline[Math.min(leadLap, raceData.weather_timeline.length) - 1];
  return entry ? { track_state: entry.track_state, temperature: entry.temperature } : raceData.weather;
}

function renderFrame(force){
  drawTrack();
  renderCars(clock);

  domThrottle++;
  if (force || domThrottle % 5 === 0){
    updateLeaderboard(clock);
    updateEventFeed(clock);
    updateDraftBoard(clock);
    updateLapCounter(clock);
    setRaceWeatherChip(weatherAt(clock));
  }
  document.getElementById('scrub').value = Math.round((clock/clockMax)*1000);
  document.getElementById('clock-label').textContent = fmtTime(clock);
}

function updateLapCounter(t){
  var field = orderedField(t);
  var leadLap = 0;
  field.forEach(function(e){ if (e.s.lap > leadLap) leadLap = e.s.lap; });
  document.getElementById('lap-now').textContent = Math.min(leadLap, raceData.num_laps);
  document.getElementById('lap-total').textContent = raceData.num_laps;
  document.getElementById('track-status').textContent = t >= clockMax ? 'finished' : 'racing';
}

function updateLeaderboard(t){
  var field = orderedField(t);
  var el = document.getElementById('leaderboard');
  var html = '';
  field.forEach(function(entry, idx){
    var s = entry.s;
    var driver = driversById[entry.id];
    var rowClass = s.status==='dnf' ? 'lb-row is-dnf' : 'lb-row';
    var gapHtml;
    if (s.status==='dnf'){ gapHtml = '<span class="lb-gap out">OUT L' + s.lap + '</span>'; }
    else if (idx===0){ gapHtml = '<span class="lb-gap leader">LEAD</span>'; }
    else { gapHtml = '<span class="lb-gap">' + fmtGap(s.gap) + '</span>'; }
    var tire = s.compound || driver.quali_compound;
    html += '<li class="'+rowClass+'">' +
      '<span class="lb-pos">'+(idx+1)+'</span>' +
      '<span class="swatch" style="background:'+driver.color_hex+'"></span>' +
      '<span class="lb-name">'+escapeHtml(driver.name)+'</span>' +
      '<span class="tire-chip tire-'+tire+'">'+tire[0]+'</span>' +
      gapHtml +
      '</li>';
  });
  el.innerHTML = html;
  document.getElementById('lb-count').textContent = raceData.drivers.length + ' cars';
}

function eventTriggerTime(ev){
  if (ev.driver_id == null){
    var best = Infinity;
    Object.keys(checkpoints).forEach(function(id){
      checkpoints[id].forEach(function(cp){
        if (!cp.dnf && cp.lap===ev.lap && cp.t!=null && cp.t<best) best = cp.t;
      });
    });
    return isFinite(best) ? best : 0;
  }
  var arr = checkpoints[ev.driver_id];
  var best = 0;
  for (var i=0;i<arr.length;i++){
    var cp = arr[i];
    if (cp.dnf && cp.lap===ev.lap) return best;
    if (!cp.dnf && cp.lap===ev.lap) return cp.t;
    if (!cp.dnf && cp.t!=null && cp.lap < ev.lap) best = cp.t;
  }
  return best;
}

function updateEventFeed(t){
  var events = raceData.race.events || [];
  var visible = events.filter(function(ev){ return eventTriggerTime(ev) <= t; });
  var el = document.getElementById('event-feed');
  if (visible.length===0){ el.innerHTML = '<li class="empty">Events will appear here as the race unfolds.</li>'; return; }
  var html = '';
  for (var i=visible.length-1;i>=0;i--){
    var ev = visible[i];
    if (ev.driver_id == null){
      html += '<li class="ev-global">' +
        '<span class="ev-lap">L'+ev.lap+'</span>' +
        '<span class="ev-dot"></span>' +
        '<span class="ev-type-'+ev.type+'">'+escapeHtml(ev.detail)+'</span>' +
        '</li>';
      continue;
    }
    var driver = driversById[ev.driver_id];
    html += '<li>' +
      '<span class="ev-lap">L'+ev.lap+'</span>' +
      '<span class="ev-dot" style="background:'+driver.color_hex+'"></span>' +
      '<span style="color:var(--text);flex:none;">'+escapeHtml(driver.name)+'</span>' +
      '<span class="ev-type-'+ev.type+'">'+escapeHtml(ev.detail)+'</span>' +
      '</li>';
  }
  el.innerHTML = html;
}

function buildDraftBoardShell(){
  var order = raceData.result.draft_order;
  var el = document.getElementById('draft-board');
  var html = '';
  order.forEach(function(driverId, i){
    html += '<div class="draft-slot" id="slot-'+i+'"><span class="pick-num">'+(i+1)+'</span><span class="pick-name pending">TBD</span></div>';
  });
  el.innerHTML = html;
}

function updateDraftBoard(t){
  var order = raceData.result.draft_order;
  order.forEach(function(driverId, i){
    var s = stateAt(driverId, t);
    var slot = document.getElementById('slot-'+i);
    if (!slot) return;
    var decided = s.status==='finished' || s.status==='dnf';
    if (decided && !slot.classList.contains('filled')){
      var driver = driversById[driverId];
      slot.classList.add('filled');
      slot.innerHTML = '<span class="pick-num">'+(i+1)+'</span>' +
        '<span class="swatch" style="background:'+driver.color_hex+'"></span>' +
        '<span class="pick-name">'+escapeHtml(driver.name)+'</span>';
    }
  });
}

function tick(ts){
  if (!playing) return;
  if (lastFrameTs==null) lastFrameTs = ts;
  var dt = (ts - lastFrameTs)/1000;
  lastFrameTs = ts;
  clock += dt * speed * 3;
  if (clock >= clockMax){
    clock = clockMax;
    playing = false;
    document.getElementById('play-btn').innerHTML = '&#9654;';
  }
  renderFrame(false);
  if (playing) requestAnimationFrame(tick);
}

function setPlaying(v){
  playing = v;
  document.getElementById('play-btn').innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
  document.getElementById('play-btn').setAttribute('aria-label', playing ? 'Pause' : 'Play');
  if (playing){
    if (clock >= clockMax) clock = 0;
    lastFrameTs = null;
    requestAnimationFrame(tick);
  }
}

function mountRace(data){
  raceData = data;
  driversById = {};
  data.drivers.forEach(function(d){ driversById[d.driver_id] = d; });

  checkpoints = {};
  data.drivers.forEach(function(d){
    checkpoints[d.driver_id] = [{ t: 0, lap: 0, position: d.driver_id, dnf:false }];
  });
  data.race.laps.forEach(function(lapEntry){
    lapEntry.cars.forEach(function(car){
      var arr = checkpoints[car.driver_id];
      if (car.event === 'DNF'){
        arr.push({ t: null, lap: car.lap, dnf: true, reason: car.reason, compound: car.compound });
      } else {
        arr.push({
          t: car.total_time, lap: car.lap, position: car.position, gap: car.gap_to_leader,
          compound: car.compound, pit: car.pit, pitLoss: car.pit_loss, overtake: car.overtake, dnf: false
        });
      }
    });
  });

  var maxT = 0;
  (data.result.classified || []).forEach(function(c){ if (c.total_time > maxT) maxT = c.total_time; });
  Object.keys(checkpoints).forEach(function(id){
    checkpoints[id].forEach(function(cp){ if (cp.t != null && cp.t > maxT) maxT = cp.t; });
  });
  clockMax = maxT || 1;
  clock = 0;
  trailHistory = {};
  laneOffset = {};

  canvas = document.getElementById('track');
  ctx = canvas.getContext('2d');
  PXSCALE = canvas.width / 900;
  CAR_SCALE = 1.4 * PXSCALE;

  data.drivers.forEach(function(d, i){
    trailHistory[d.driver_id] = [];
    laneOffset[d.driver_id] = ((i % 5) - 2) * 6 * PXSCALE;
  });

  buildTrackGeometry((data.circuit && data.circuit.shape) ? data.circuit.shape : DEFAULT_TRACK_SHAPE);
  setCircuitLabel(data.circuit);

  buildDraftBoardShell();

  document.getElementById('play-btn').addEventListener('click', function(){ setPlaying(!playing); });
  document.getElementById('scrub').addEventListener('input', function(e){
    playing = false;
    document.getElementById('play-btn').innerHTML = '&#9654;';
    clock = (e.target.value/1000) * clockMax;
    renderFrame(true);
  });
  document.getElementById('speed').addEventListener('change', function(e){
    speed = parseFloat(e.target.value);
  });

  function resizeCanvas(){
    var wrap = canvas.parentElement;
    var w = wrap.clientWidth;
    canvas.style.height = (w * (canvas.height/canvas.width)) + 'px';
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  renderFrame(true);
  setPlaying(true);
}

// ---------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------

connect();
</script>
</body>
</html>
